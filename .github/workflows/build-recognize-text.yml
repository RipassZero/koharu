name: Build Windows (Recognize text)

# Builds the Windows app from this branch so it can be downloaded from the
# run's Artifacts section. Runs on every push to the branch, or by hand.
on:
  push:
    branches: ['recognize-text']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: windows-latest
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: koharu-recognize-text-windows
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: windows-bun-${{ hashFiles('**/bun.lock') }}
      - run: bun install
      # Bundle an installer like the official release does, so the browser
      # engine (libcef.dll and friends) ships with the app. The official
      # signing and updater keys are not available in a fork, so both are off.
      - name: Build installer
        shell: bash
        run: |
          set -o pipefail
          cargo tauri build --bundles nsis \
            --config '{"bundle":{"createUpdaterArtifacts":false,"windows":{"signCommand":null}}}' \
            2>&1 | tee build.log
      # Surface the end of the build output as annotations, which can be read
      # through the API even when the full log download is unavailable.
      - name: Report build output
        if: always()
        shell: bash
        run: |
          echo "::notice title=release folder::$(ls target/release 2>&1 | tr '\n' ' ')"
          echo "::notice title=bundle folder::$(ls -R target/release/bundle 2>&1 | tr '\n' ' ' | cut -c1-900)"
          grep -v '^\s*Compiling ' build.log | tail -n 60 | tr -d '\r' | sed 's/%/%25/g' > tail.log
          for part in 1 2 3 4 5 6; do
            chunk=$(sed -n "$(( (part-1)*10+1 )),$(( part*10 ))p" tail.log | awk 'BEGIN{ORS="%0A"} {print}')
            [ -n "$chunk" ] && echo "::warning title=build output $part::$chunk"
          done
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Koharu-Recognize-Text-Windows-Installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
