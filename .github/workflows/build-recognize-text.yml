name: Build Windows (Recognize text)

# Builds the Windows app from this branch so it can be downloaded from the
# run's Artifacts section. Runs on every push to the branch, or by hand.
on:
  push:
    branches: ['recognize-text']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: windows-latest
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: koharu-recognize-text-windows
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: windows-bun-${{ hashFiles('**/bun.lock') }}
      - run: bun install
      - run: bun run build
      # The build places the CEF browser runtime (libcef.dll, .pak files,
      # locales, ...) next to koharu.exe. Ship the app together with exactly
      # those runtime files as a portable folder, leaving out build leftovers.
      - name: Assemble portable app
        shell: bash
        run: |
          set -euo pipefail
          out="Koharu Recognize Text"
          mkdir "$out"
          cd target/release
          cp koharu.exe *.dll *.pak *.dat *.bin vk_swiftshader_icd.json "../../$out/"
          cp -r locales "../../$out/"
          cd ../..
          test -f "$out/libcef.dll"
          echo "::notice title=portable app::$(ls "$out" | tr '\n' ' ')"
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Koharu-Recognize-Text-Windows
          path: Koharu Recognize Text
          if-no-files-found: error
          retention-days: 30
