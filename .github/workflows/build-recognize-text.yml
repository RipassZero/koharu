name: Build Windows (Recognize text)

# Builds the Windows app from main and publishes it as a Release, so the
# latest build is always downloadable from the repository's Releases page.
# Runs on every push to main, or by hand from the Actions tab.
on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: windows-latest
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: koharu-recognize-text-windows
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: windows-bun-${{ hashFiles('**/bun.lock') }}
      - run: bun install
      - run: bun run build
      # The build places the CEF browser runtime (libcef.dll, .pak files,
      # locales, ...) next to koharu.exe. Ship the app together with exactly
      # those runtime files as a portable folder, leaving out build leftovers.
      - name: Assemble portable app
        shell: bash
        run: |
          set -euo pipefail
          out="Koharu Recognize Text"
          mkdir "$out"
          cd target/release
          cp koharu.exe *.dll *.pak *.dat *.bin vk_swiftshader_icd.json "../../$out/"
          cp -r locales "../../$out/"
          cd ../..
          test -f "$out/libcef.dll"
          7z a -tzip Koharu-Recognize-Text-Windows.zip "$out" > /dev/null
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="build-${{ github.run_number }}"
          gh release create "$tag" Koharu-Recognize-Text-Windows.zip \
            --target "${{ github.sha }}" \
            --title "Koharu Recognize Text (build ${{ github.run_number }})" \
            --latest \
            --notes "Windows build of commit ${{ github.sha }}.

          Download **Koharu-Recognize-Text-Windows.zip**, extract the whole folder, and run \`koharu.exe\` inside it. Keep every file together; the app needs the files next to it to start."
